<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="cache-control" content="no-cache">
<title>Flights — the logistics · TravelTank Inspiration</title>
<link rel="stylesheet" href="assets/tt.css?v=34">
<style>
  .top-actions{display:flex;justify-content:space-between;padding:26px 0 0;gap:12px;}
  .shell{padding-bottom:80px;}

  .crumb{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:30px 0 10px;font-weight:600;}
  .crumb b{color:var(--ink);}

  .trip{border:1px solid var(--line);background:var(--panel-2);padding:22px 26px;margin:22px 0 34px;}
  .trip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
  .trip-grid .v{font-size:1rem;color:var(--ink);margin-top:4px;}
  .trip-grid .v small{display:block;font-size:.8rem;color:var(--ink-3);margin-top:2px;font-weight:400;}
  @media(max-width:760px){.trip-grid{grid-template-columns:1fr 1fr;}}

  .sec{margin-top:38px;}
  .sec-hd{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap;}
  .sec-hd h2{margin:0;font-size:1.5rem;letter-spacing:-.02em;}
  .sec-hd .hint{margin-left:auto;}
  .sec-sub{margin:0 0 18px;font-size:.95rem;color:var(--ink-3);max-width:70ch;}

  .pick{border:1px solid var(--ink);padding:0;margin-bottom:26px;}
  .pick-hd{
    background:var(--ink);color:#fff;padding:9px 18px;
    font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
  }
  .fl{
    display:grid;grid-template-columns:24px 1.5fr 1fr 1fr auto;gap:18px;align-items:center;
    border:0;padding:17px 20px;cursor:pointer;background:#fff;
    text-align:left;width:100%;
  }
  .pick .fl{border:0;margin:0;}
  .fl:hover{background:var(--panel-2);}
  .radio{width:16px;height:16px;border:1px solid var(--ink-3);border-radius:50%;display:inline-block;}
  .fl.on .radio{border:5px solid var(--ink);}
  .fl .car{font-weight:600;font-size:.98rem;display:block;}
  .fl .rt{font-size:.83rem;color:var(--ink-3);margin-top:3px;display:block;}
  .fl .dur{font-size:.95rem;color:var(--ink);}
  .fl .stp{font-size:.8rem;color:var(--ink-3);display:block;margin-top:3px;}
  .fl .nt{font-size:.83rem;color:var(--ink-3);}
  .fl .pr{text-align:right;white-space:nowrap;}
  .fl .pr b{font-size:1.1rem;}
  .fl .pr span{display:block;font-size:.76rem;color:var(--ink-3);margin-top:2px;}
  @media(max-width:820px){
    .fl{grid-template-columns:24px 1fr auto;row-gap:8px;}
    .fl .note-col{display:none;}
    .fl .dur-col{grid-column:2 / -1;}
  }

  /* ---- cabin switcher ---- */
  .cabins{display:flex;gap:2px;flex-wrap:wrap;margin:0 0 22px;}
  .cabin{
    border:1px solid var(--line);background:var(--panel-2);padding:11px 20px;cursor:pointer;
    font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--ink-3);
  }
  .cabin.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .cabin-note{font-size:.86rem;color:var(--ink-3);margin:-12px 0 22px;}

  /* ---- flight detail ---- */
  .fwrap{border:1px solid var(--line);margin-bottom:12px;background:#fff;}
  .fwrap:last-child{margin-bottom:0;}
  .fwrap.sel,.fwrap.on{border-color:var(--ink);}
  .pick .fwrap{border:0;margin:0;}
  .fdet{border-top:1px solid var(--line-2);padding:22px 20px 24px;background:var(--panel-2);}
  .fdet-grid{display:grid;grid-template-columns:1fr 320px;gap:34px;}
  @media(max-width:900px){.fdet-grid{grid-template-columns:1fr;gap:24px;}}
  .leg + .leg{margin-top:26px;padding-top:24px;border-top:1px solid var(--line);}
  .leg-hd{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--ink);}
  .leg-car{display:flex;align-items:center;gap:12px;margin-top:12px;}
  .leg-car .mark{
    width:38px;height:24px;border:1px solid var(--line);background:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:.62rem;font-weight:700;letter-spacing:.06em;color:var(--ink-2);
  }
  .leg-car .nm{font-size:.95rem;color:var(--ink);font-weight:600;}

  /* the timeline: duration in the rail, points down the line */
  .tl{display:grid;grid-template-columns:74px 14px 1fr;gap:0 14px;margin-top:16px;}
  .tl-dur{
    grid-column:1;grid-row:1 / span 3;align-self:center;
    font-size:.86rem;font-weight:600;color:var(--ink-2);
  }
  .tl-line{grid-column:2;grid-row:1 / span 3;position:relative;}
  .tl-line::before{
    content:'';position:absolute;left:50%;top:7px;bottom:7px;width:1px;
    background:var(--line);transform:translateX(-50%);
  }
  .tl-dot{
    position:absolute;left:50%;width:9px;height:9px;border-radius:50%;
    background:var(--ink);transform:translateX(-50%);
  }
  .tl-dot.a{top:4px;}
  .tl-dot.b{bottom:4px;}
  .tl-dot.mid{top:50%;margin-top:-4.5px;background:#fff;border:1px solid var(--ink);}
  .tl-pt{grid-column:3;display:flex;gap:14px;align-items:baseline;}
  .tl-pt .t{font-size:1rem;font-weight:600;min-width:48px;}
  .tl-pt .p{font-size:.93rem;color:var(--ink-2);}
  .tl-pt .p .cd{color:var(--ink-3);font-weight:600;margin-right:5px;}
  .tl-mid{grid-column:3;padding:12px 0;}
  .tl-mid .craft{
    display:inline-block;border:1px solid var(--line);background:#fff;
    padding:7px 13px;font-size:.85rem;color:var(--ink-2);
  }
  .tl-mid .via{display:block;margin-top:8px;font-size:.82rem;color:var(--ink-3);}
  .leg-foot{
    margin-top:16px;padding-top:12px;border-top:1px solid var(--line-2);
    font-size:.86rem;color:var(--ink-2);font-weight:600;
  }
  .leg-foot span{color:var(--ink-3);font-weight:400;}
  @media(max-width:620px){
    .tl{grid-template-columns:56px 14px 1fr;}
    .tl-pt{flex-direction:column;gap:2px;}
  }

  .fare{border:1px solid var(--line);background:#fff;padding:18px 20px;}
  .fare .frow{
    display:flex;justify-content:space-between;gap:14px;padding:9px 0;
    font-size:.9rem;color:var(--ink-2);border-bottom:1px solid var(--line-2);
  }
  .fare .frow b{color:var(--ink);}
  .fare .ftot{
    display:flex;justify-content:space-between;gap:14px;align-items:baseline;
    margin-top:14px;padding-top:14px;border-top:1px solid var(--ink);
  }
  .fare .ftot .k{font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:var(--ink-3);}
  .fare .ftot .v{font-size:1.32rem;font-weight:600;letter-spacing:-.02em;}
  .fare .rules{margin-top:12px;font-size:.82rem;color:var(--ink-3);}
  .fare .warn{margin-top:10px;font-size:.83rem;color:var(--ink-2);border-left:2px solid var(--line);padding-left:12px;}

  .fmore{
    display:flex;align-items:center;gap:7px;background:none;border:0;padding:12px 20px;
    cursor:pointer;font:inherit;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;
    font-weight:600;color:var(--ink-3);width:100%;border-top:1px solid var(--line-2);
  }
  .fmore:hover{color:var(--ink);background:var(--panel-2);}
  .fmore .caret{transition:transform .15s;display:inline-block;}
  .fwrap.on .fmore .caret{transform:rotate(90deg);}

  .total{border:1px solid var(--ink);padding:26px 30px;margin-top:34px;}
  .total-top{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;}
  .total .big{font-size:2.2rem;font-weight:600;letter-spacing:-.025em;line-height:1;}
  .total .bd{font-size:.88rem;color:var(--ink-3);}
  .breakdown{
    display:grid;grid-template-columns:1fr auto;gap:9px 24px;
    margin-top:22px;padding-top:18px;border-top:1px solid var(--line-2);
    font-size:.92rem;color:var(--ink-2);max-width:520px;
  }
  .breakdown .amt{text-align:right;white-space:nowrap;}
  .breakdown .tot{font-weight:600;color:var(--ink);border-top:1px solid var(--line-2);padding-top:9px;}
  .btn-row{margin-top:26px;}
  .disclaim{margin-top:16px;font-size:.82rem;color:var(--ink-3);max-width:70ch;}
</style>
</head>
<body>

<main class="shell">
  <div class="top-actions">
    <button class="btn btn-cap" id="back">&lsaquo; Back to the destination</button>
    <button class="btn btn-cap" id="startAgain">Start again</button>
  </div>

  <div id="page"></div>
</main>

<script src="assets/data.js?v=34"></script>
<script src="assets/core.js?v=34"></script>
<script>
TT.mount('flights.html');

const brief = TT.load();
const trip = brief.trip;
const page = document.getElementById('page');

document.getElementById('startAgain').addEventListener('click', ()=>{
  TT.clear();
  location.href = brief.source ? brief.source + '.html' : 'index.html';
});
document.getElementById('back').addEventListener('click', ()=>{ location.href = 'results-v2.html'; });

if(!trip || !DEST.find(d=>d.id === trip.dest)){
  page.innerHTML =
    '<h1>Nothing chosen yet</h1>' +
    '<p class="lede">Pick a destination first and we will price the flights for your party.</p>' +
    '<div class="btn-row"><a class="btn btn-primary" href="results-v2.html" style="text-decoration:none;">Back to the recommendations</a></div>';
} else {
  render();
}

function render(){
  const d = DEST.find(x=>x.id === trip.dest);
  const nights = trip.nights || TT.nights(brief);
  const people = trip.adults + trip.children;

  /* The hotel side is already settled — this page only moves the flight. */
  const hotel = trip.hotel !== null && trip.hotel !== undefined ? d.hotels[trip.tier][trip.hotel] : null;
  const room  = hotel ? (TT.roomsFor(hotel).find(r=>r.id === trip.room) || TT.roomsFor(hotel)[0]) : null;
  const roomsNeeded = hotel ? Math.max(trip.rooms, TT.roomsNeeded(room, trip.adults, trip.children)) : 0;
  const stay = hotel ? room.night * roomsNeeded * nights : 0;

  if(trip.flight === undefined) trip.flight = suggestFlight(d);
  const cabins = TT.cabinsFor(d);
  if(!trip.cabin || !cabins.some(c=>c.id === trip.cabin)) trip.cabin = 'eco';
  const flight = d.flights[trip.flight];
  const fare = TT.farePrice(flight, trip.cabin);
  const air = fare * people;

  /* Everything except the one we are recommending above. Filtering out the
     *selected* flight too would make it vanish the moment you picked it. */
  const others = d.flights.map((f,i)=>({f:f, i:i})).filter(x=>x.i !== suggestFlight(d));

  page.innerHTML =
    '<div class="crumb">Step 2 of 2 &middot; <b>' + TT.esc(d.name) + '</b> &middot; the logistics</div>' +
    '<h1>Getting you there</h1>' +
    '<p class="lede">The inspiration is settled. This part is just picking the flight that suits you — ' +
      'we have suggested one, but the rest of the route is here.</p>' +

    '<div class="trip">' +
      '<div class="trip-grid">' +
        '<div><span class="lab">Destination</span><div class="v">' + TT.esc(d.name) +
          '<small>' + TT.esc(d.country) + '</small></div></div>' +
        '<div><span class="lab">Dates</span><div class="v">' + TT.fmtDate(trip.from) +
          '<small>to ' + TT.fmtDate(TT.addDays(trip.from, nights)) + ' · ' + nights + ' nights</small></div></div>' +
        '<div><span class="lab">Travelling</span><div class="v">' + people + ' travelling' +
          '<small>' + trip.adults + ' adult' + (trip.adults===1?'':'s') +
            (trip.children ? ', ' + trip.children + ' child' + (trip.children===1?'':'ren') : '') + '</small></div></div>' +
        '<div><span class="lab">Staying at</span><div class="v">' + (hotel ? TT.esc(hotel.n) : 'Not chosen') +
          '<small>' + (hotel ? roomsNeeded + ' × ' + TT.esc(room.name).toLowerCase() : 'You can add this later') + '</small></div></div>' +
      '</div>' +
    '</div>' +

    '<div class="sec">' +
      '<div class="sec-hd"><h2>Cabin</h2></div>' +
      '<div class="cabins">' + cabins.map(c=>
        '<button type="button" class="cabin' + (c.id===trip.cabin?' on':'') + '" data-cabin="' + c.id + '">' +
          TT.esc(c.label) + '</button>').join('') + '</div>' +
      '<p class="cabin-note">' + (trip.cabin === 'eco'
        ? 'Economy. Switch cabin and every fare below reprices.'
        : TT.cabinOf(trip.cabin).label + ' — ' + TT.fareRules(trip.cabin).toLowerCase() + '.') + '</p>' +
    '</div>' +

    '<div class="sec">' +
      '<div class="sec-hd"><h2>The one we would book</h2>' +
        '<span class="hint">Return from Lagos &middot; economy &middot; indicative</span></div>' +
      '<p class="sec-sub">' + TT.esc(suggestReason(d, trip.flight)) + '</p>' +
      '<div class="pick">' +
        '<div class="pick-hd">Our suggestion</div>' +
        flightRow(d.flights[suggestFlight(d)], suggestFlight(d), people, trip.flight === suggestFlight(d), d) +
      '</div>' +
    '</div>' +

    '<div class="sec">' +
      '<div class="sec-hd"><h2>Everything else on the route</h2></div>' +
      '<p class="sec-sub">Same dates, same cabin. Cheaper usually means a longer layover.</p>' +
      others.map(x=>flightRow(x.f, x.i, people, trip.flight === x.i, d)).join('') +
    '</div>' +

    '<div class="total">' +
      '<div class="total-top">' +
        '<div><span class="lab">Indicative trip total</span>' +
          '<div class="big">' + TT.money(air + stay) + '</div>' +
          '<div class="bd">' + people + ' travelling &middot; ' + nights + ' nights</div></div>' +
      '</div>' +
      '<div class="breakdown">' +
        '<div>Flights &mdash; ' + TT.esc(flight.carrier) + ', ' + TT.cabinOf(trip.cabin).label.toLowerCase() +
          ', ' + people + ' &times; ' + TT.money(fare) + '</div>' +
        '<div class="amt">' + TT.money(air) + '</div>' +
        (hotel
          ? '<div>Hotel &mdash; ' + TT.esc(hotel.n) + ', ' + roomsNeeded + ' room' + (roomsNeeded===1?'':'s') +
              ' &times; ' + nights + ' nights</div><div class="amt">' + TT.money(stay) + '</div>'
          : '<div>Hotel &mdash; not chosen yet</div><div class="amt">&mdash;</div>') +
        '<div class="tot">Total</div><div class="amt tot">' + TT.money(air + stay) + '</div>' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="book">Book this trip</button>' +
        '<button class="btn" id="shark">Speak to a Travel Shark</button>' +
      '</div>' +
      '<p class="disclaim">Indicative only — fares and rates move. A Travel Shark confirms the real price before anything is booked.</p>' +
    '</div>';

  page.querySelectorAll('[data-fl]').forEach(el=>{
    el.addEventListener('click', ()=>{
      trip.flight = +el.dataset.fl;
      brief.trip = trip; TT.save(brief); render();
    });
  });
  page.querySelectorAll('[data-more]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = +el.dataset.more;
      trip.open = (trip.open === i) ? null : i;
      brief.trip = trip; TT.save(brief); render();
    });
  });
  page.querySelectorAll('[data-cabin]').forEach(el=>{
    el.addEventListener('click', ()=>{
      trip.cabin = el.dataset.cabin;
      brief.trip = trip; TT.save(brief); render();
    });
  });
  page.querySelector('#book').addEventListener('click', e=>{
    /* The disclaimer says a Travel Shark confirms the real price, so this cannot
       claim the trip is booked. */
    e.currentTarget.textContent = 'Booking started';
    e.currentTarget.disabled = true;
  });
  /* Land on the results page with the handoff already open, so the button does
     what it says rather than just navigating back. */
  page.querySelector('#shark').addEventListener('click', ()=>{ location.href = 'results-v2.html#shark'; });
}

function nts(n){ return n + ' night' + (n === 1 ? '' : 's'); }

function nightsOf(){ return trip.nights || TT.nights(brief); }

function flightRow(f, i, people, on, d){
  const open = trip.open === i;
  const fare = TT.farePrice(f, trip.cabin);
  return '<div class="fwrap' + (open ? ' on' : '') + (on ? ' sel' : '') + '">' +
    '<button type="button" class="fl' + (on?' on':'') + '" data-fl="' + i + '">' +
      '<span class="radio"></span>' +
      '<span><span class="car">' + TT.esc(f.carrier) + '</span><span class="rt">' + TT.esc(f.route) + '</span></span>' +
      '<span class="dur-col"><span class="dur">' + f.dur + '</span><span class="stp">' + f.stops + '</span></span>' +
      '<span class="note-col"><span class="nt">' + TT.esc(f.note) + '</span></span>' +
      '<span class="pr"><b>' + TT.money(fare * people) + '</b><span>' + people + ' &times; ' + TT.money(fare) + '</span></span>' +
    '</button>' +
    '<button type="button" class="fmore" data-more="' + i + '">' +
      (open ? 'Hide flight details' : 'View flight details') + '<span class="caret">&rsaquo;</span></button>' +
    (open ? flightDetail(f, d, people, fare, nightsOf()) : '') +
  '</div>';
}

function airport(code){
  return '<span class="cd">' + TT.esc(code) + '</span>' + TT.esc(AIRPORTS[code] || code);
}

function legBlock(g, label, dateISO){
  const arrives = TT.addDays(dateISO, g.plusDay);
  return '<div class="leg">' +
    '<div class="leg-hd">' + label + '</div>' +
    '<div class="leg-car">' +
      '<span class="mark">' + TT.esc(g.no.split(' ')[0]) + '</span>' +
      '<span class="nm">' + TT.esc(g.carrier) + ' ' + TT.esc(g.no) + '</span>' +
    '</div>' +
    '<div class="tl">' +
      '<div class="tl-dur">' + g.dur + '</div>' +
      '<div class="tl-line">' +
        '<span class="tl-dot a"></span>' +
        (g.via.length ? '<span class="tl-dot mid"></span>' : '') +
        '<span class="tl-dot b"></span>' +
      '</div>' +
      '<div class="tl-pt"><span class="t">' + g.dep + '</span><span class="p">' + airport(g.from) + '</span></div>' +
      '<div class="tl-mid">' +
        '<span class="craft">' + TT.esc(g.aircraft) + '</span>' +
        (g.via.length
          ? '<span class="via">' + TT.esc(g.stops) + ' — connects at ' +
              g.via.map(v=>TT.esc(AIRPORTS[v] || v)).join(', ') + '</span>'
          : '<span class="via">Direct</span>') +
      '</div>' +
      '<div class="tl-pt"><span class="t">' + g.arr +
        (g.plusDay ? '<span class="plus">+' + g.plusDay + '</span>' : '') + '</span>' +
        '<span class="p">' + airport(g.to) + '</span></div>' +
    '</div>' +
    '<div class="leg-foot">Arrives: ' + TT.fmtDate(arrives) +
      ' <span>|</span> Journey duration: ' + g.dur + '</div>' +
  '</div>';
}

function flightDetail(f, d, people, fare, nights){
  const bags = TT.baggageFor(f, trip.cabin);
  return '<div class="fdet"><div class="fdet-grid">' +
    '<div>' +
      legBlock(TT.legOf(f, d, 'out'), 'Outbound', trip.from) +
      legBlock(TT.legOf(f, d, 'in'),  'Inbound',  TT.addDays(trip.from, nights)) +
    '</div>' +
    '<div>' +
      '<div class="fare">' +
        '<span class="lab">Fare breakdown</span>' +
        '<div class="frow" style="margin-top:10px;"><span>Cabin</span><b>' + TT.cabinOf(trip.cabin).label + '</b></div>' +
        '<div class="frow"><span>Hand baggage</span><b>' + bags.hand + '</b></div>' +
        '<div class="frow"><span>Checked bag</span><b>' + bags.checked + '</b></div>' +
        '<div class="frow"><span>Travellers</span><b>' + people + ' &times; ' + TT.money(fare) + '</b></div>' +
        '<div class="ftot"><span class="k">Total</span><span class="v">' + TT.money(fare * people) + '</span></div>' +
        '<div class="rules">' + TT.fareRules(trip.cabin) + '</div>' +
        (bags.stripped
          ? '<div class="warn">This fare has no hold luggage. For a week away that is usually the wrong saving.</div>'
          : '') +
      '</div>' +
    '</div>' +
  '</div></div>';
}

/* Best value, not cheapest. A stripped fare is heavily penalised — recommending
   hand-baggage-only to a family for a week is bad advice however cheap it is. */
function stripped(f){ return /hand baggage|no bag|carry-on only/i.test(f.note); }

function suggestFlight(d){
  const cheapest = d.flights.reduce((a,b)=>a.price<=b.price?a:b);
  let best = 0, bestScore = -Infinity;
  d.flights.forEach((f,i)=>{
    let sc = -mins(f.dur)/60;
    if(stripped(f)) sc -= 8;
    if(/direct/i.test(f.stops)) sc += 2;
    sc -= (f.price - cheapest.price) / 150000;
    if(sc > bestScore){ bestScore = sc; best = i; }
  });
  return best;
}
function mins(dur){
  const m = dur.match(/(\d+)h\s*(\d+)?/);
  return m ? (+m[1])*60 + (+(m[2]||0)) : 9999;
}
function suggestReason(d, i){
  const f = d.flights[i];
  const cheapest = d.flights.reduce((a,b)=>a.price<=b.price?a:b);
  const quickest = d.flights.reduce((a,b)=>mins(a.dur)<=mins(b.dur)?a:b);
  const saveHrs = Math.round((mins(cheapest.dur) - mins(f.dur)) / 6) / 10;

  if(f !== cheapest && stripped(cheapest)){
    return 'The cheaper ' + cheapest.carrier + ' fare is hand baggage only, which does not work for a week away. ' +
      'This is the next one up and it carries a proper bag' +
      (saveHrs > 0.4 ? ', and gets you there ' + saveHrs + ' hours sooner' : '') + '.';
  }
  if(f === cheapest && f === quickest) return 'Cheapest and quickest on the route, with a normal baggage allowance — nothing to weigh up.';
  if(f === quickest) return 'The quickest way there. ' + TT.money(f.price - cheapest.price) +
    ' per person more than the cheapest, to save ' + saveHrs + ' hours each way.';
  if(f === cheapest) return 'The cheapest on the route, and the journey is no worse than the alternatives.';
  return 'The best balance on the route — ' + f.dur + ' without paying for the top fare.';
}
</script>
